<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <title>Page Not Found | FaithForge Gaming</title>
  <style>
    :root {
      --gold: #f5c518;
      --gold-dark: #cfa214;
      --text: #f5f5f5;
      --muted: #c7c7c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0d0d0d;
      background: radial-gradient(circle at 50% 40%, #17150d 0%, #0d0d0d 40%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
      line-height: 1.6;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 100%;
      color: var(--gold);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    .error-code {
      margin: 26px 0 12px;
      color: var(--gold);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 5vw, 2.75rem);
      line-height: 1.2;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .description {
      max-width: 480px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.125rem;
      text-wrap: pretty;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 11px 24px;
      border: 2px solid var(--gold);
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .button-gold {
      background: linear-gradient(45deg, var(--gold), var(--gold-dark));
      color: #000;
      box-shadow: 0 0 20px rgb(245 197 24 / 18%);
    }

    .button-outline {
      background: transparent;
      color: var(--gold);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgb(245 197 24 / 28%);
    }

    .button-outline:hover {
      background: rgb(245 197 24 / 10%);
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 6px;
    }

    .tagline {
      margin: 38px 0 0;
      color: #c9bd83;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      main { padding: 32px 20px; }
      .brand { font-size: 0.875rem; letter-spacing: 0.08em; }
      .button-row { flex-direction: column; }
      .button { width: 100%; }
      .tagline { letter-spacing: 0.07em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="container">
      <a class="brand" href="/" aria-label="FaithForge Gaming home">
        <img src="https://faithforgegaming.com/Anvil.webp" alt="" width="76" height="76">
        <span>FAITHFORGE GAMING</span>
      </a>

      <p class="error-code" aria-label="Error 404">404</p>
      <h1 id="page-title">That page wandered off.</h1>
      <p class="description">
        The link may have changed, but the community is still here.
        Let’s get you back to the forge.
      </p>

      <div class="button-row">
        <a class="button button-gold" href="/">Return home</a>
        <a class="button button-outline" href="https://discord.gg/bAQrudk5a9">Join our Discord</a>
      </div>

      <p class="tagline">Faith &bull; Fellowship &bull; Gaming</p>
    </div>
  </main>
</body>
</html>
